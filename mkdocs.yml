site_name: "Meta-Evaluation of Language Model Evaluation Methods for Systems Engineering"
site_url: https://ryan-a-bell.github.io/dissertation/
site_description: "PhD Dissertation: An Empirical Meta-Evaluation of Language Model Evaluation Methods for Systems Engineering Using Distractor Sensitivity and Consensus Judging"
site_author: "Ryan Bell"

theme:
  name: material
  logo: assets/nps-logo.jpg
  favicon: assets/nps-logo.jpg
  features:
    - navigation.tabs
    - navigation.path
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.integrate
    - navigation.sections
    - navigation.expand
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css
  - stylesheets/nps_custom_css.css
extra_javascript:
  - https://unpkg.com/mermaid@10.6.1/dist/mermaid.min.js
  - assets/js/extra.js
  # Theme switcher disabled - uncomment line below to re-enable
  # - javascripts/mkdocs_theme_switcher.js

plugins:
  - search:
      separator: '[\s\-\._\/]+'
  - social:
      cards: !ENV [CARDS, true]
  - glightbox
  - awesome-pages
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
  - table-reader
  - mkdocs-jupyter:
      execute: false
      # If you ever need to skip certain heavy/problematic notebooks:
      # execute_ignore:
      #   - "docs/path/to/*.ipynb"


markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - footnotes
  - pymdownx.tabbed:
      alternate_style: true

extra:
  meta:
    - property: og:type
      content: website
    - property: og:site_name
      content: Ryan Bell - PhD Dissertation
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ryan-a-bell
      name: GitHub
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/ryan-bell-4139498a/
      name: LinkedIn
    - icon: fontawesome/solid/face-smile
      link: https://huggingface.co/rabell
      name: HuggingFace
    - icon: fontawesome/solid/envelope
      link: mailto:ryan.bell@nps.edu
      name: Email
  generator: false

copyright: Copyright &copy; 2024–2026 Ryan Bell · Naval Postgraduate School
