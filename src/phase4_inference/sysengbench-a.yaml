
task: sysengbench-a
dataset_path: rabell/SysEngBench-A
dataset_name: null
output_type: generate_until
training_split: null
validation_split: null
test_split: test
doc_to_text: "Given the following question and four candidate answers (A, B, C and D), choose the best answer.
Your response must consist solely of the single letter corresponding to the best answer, chosen from one of A, B, C or D.
Any response other than a single letter (A, B, C, or D) will be considered invalid.

Question: {{question}}

A. {{choiceA}}

B. {{choiceB}}

C. {{choiceC}}

D. {{choiceD}}

Answer:"
doc_to_target: "{{answer}}"

generation_kwargs:
  until: []  # No early stopping for thinking models
  max_gen_toks: 10000  # High limit for reasoning traces
  temperature: 0.0  # Deterministic for evaluation

filter_list:
  - name: "strict-match"
    filter:
      - function: "regex"
        regex_pattern: "([ABCD])"
      - function: "take_first"
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
    ignore_punctuation: true
    ignore_case: true
metadata:
  version: 1.0
dataset_kwargs:
  trust_remote_code: true
