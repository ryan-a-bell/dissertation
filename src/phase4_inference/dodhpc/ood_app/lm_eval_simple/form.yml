---
title: "LM Evaluation Launcher"
attributes:
  cluster:
    widget: "hidden_field"
    value: "your_cluster"     # TODO: set to your OOD cluster name

  model:
    label: "Model name (Ollama tag)"
    widget: "text_field"
    value: "mistral:7b"

  task:
    label: "Task name"
    widget: "text_field"
    value: "sysengbench-a"

  tasks_dir:
    label: "Tasks directory"
    widget: "text_field"
    value: "~/hpc_lm_eval/tasks"

  output_root:
    label: "Output root directory"
    widget: "text_field"
    value: "~/hpc_lm_eval/output"

  gpus:
    label: "GPUs per job"
    widget: "number_field"
    value: 1
    min: 1
    max: 4

form:
  - cluster
  - model
  - task
  - tasks_dir
  - output_root
  - gpus
